name: DocuMind CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: DocuMind
      APP_ENV: test
      APP_VERSION: 0.1.0
      DEBUG: false
      DATABASE_URL: postgresql+psycopg://documind:documind@localhost:5432/documind
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      FAISS_INDEX_PATH: data/indexes/documind.faiss
      OPENAI_API_KEY: dummy_key_for_ci
      OPENAI_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import FastAPI app
        run: |
          python -c "from app.main import app; print('DocuMind app imported successfully')"

      - name: Run tests
        run: |
          python -m pytest